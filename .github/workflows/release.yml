name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the release + upload assets

env:
  NODE_VERSION: '24'
  RUST_VERSION: 'stable'  # min is 1.77.2 (Cargo.toml rust-version); must match local cargo to parse lockfile

jobs:
  build-release:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app & publish release
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NC Sound Lab ${{ github.ref_name }}'
          releaseBody: |
            NC Sound Lab Studio installer (Windows x64). The auto-update bundle is
            included in the release assets.

            ## 1.1.1 — metering, stability and shared chrome

            - The Compare Engine now measures stereo correlation and width from a
              real splitter + L/R analysers instead of returning hard-coded values.
            - Shimmer + reverb feedback is clamped to 0.88 and every FX target is
              bounded before render, so a hostile rack cannot self-oscillate.
            - Late note callbacks can no longer schedule in the past; pan/filter
              values are clamped and `resume()` is non-blocking on the audio path.
            - Layer meters update at ~12 fps and only publish meaningful peaks,
              removing sequencer jank while playing.
            - Brand tokens mirror the shared studio spec; the shared waveform
              display is token-driven while the touch field editor stays bespoke.
            - Session export and autosave metadata read one version constant,
              pinned to `package.json` by a test.

            Verified: `tsc --noEmit` clean, engine boundary clean, production
            build green, and the full Vitest suite passes. The installer remains
            unsigned during beta.
          releaseDraft: true
          prerelease: false
