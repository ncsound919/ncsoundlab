server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self' http://localhost:3050 http://127.0.0.1:3050; object-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Hashed build assets are immutable; the worker and manifest must revalidate
    # so a deploy can take over on the next load. `expires` is used instead of
    # `add_header` so these locations still inherit the security headers above
    # (nginx drops inherited add_header directives when a location adds its own).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location ~ ^/workbox-.*\.js$ {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.json {
        expires -1;
        try_files $uri =404;
    }

    location = /field.html {
        expires -1;
        try_files $uri =404;
    }

    location = /field {
        try_files /field.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}